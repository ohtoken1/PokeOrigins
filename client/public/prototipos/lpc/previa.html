<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia do personagem (LPC)</title>
<style>
  :root { --fundo: #15263c; --painel: #1b2f4a; --painel-2: #233a58; --borda: #34507a; --texto: #eef3fa; --texto-2: #a2b4cc; --destaque: #ffcb05; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; color: var(--texto);
    background: url('/fundo.svg') center bottom / cover no-repeat fixed, var(--fundo); }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px; display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 1.4rem; }
  h1 small { color: var(--texto-2); font-weight: 500; font-size: 0.85rem; }
  .palco { background: rgb(27 47 74 / 0.55); backdrop-filter: blur(4px); border: 1px solid var(--borda); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .chao { width: 100%; display: grid; place-items: center; border-radius: 12px; padding: 12px;
    background: repeating-conic-gradient(#5aa25a 0 25%, #63ad61 0 50%) 0 0 / 32px 32px; }
  canvas { image-rendering: pixelated; }
  .direcoes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .painel { background: rgb(27 47 74 / 0.55); backdrop-filter: blur(4px); border: 1px solid var(--borda); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .grupo > span { display: block; font-size: 0.75rem; color: var(--texto-2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: var(--texto); background: var(--painel-2); border: 1px solid var(--borda); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button.ativo { border-color: var(--destaque); box-shadow: 0 0 0 1px var(--destaque) inset; }
  .cor { width: 26px; height: 26px; padding: 0; border-radius: 50%; }
  .lado { display: flex; gap: 24px; align-items: flex-end; justify-content: center; flex-wrap: wrap; }
  .lado figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  figcaption { font-size: 0.75rem; color: var(--texto-2); }
  footer { grid-column: 1 / -1; font-size: 0.72rem; color: var(--texto-2); }
</style>
</head>
<body>
<main>
  <h1>Prévia do personagem <small>· LPC (Liberated Pixel Cup) · não está no jogo</small></h1>
  <section class="palco">
    <div class="chao"><div class="lado">
      <figure><canvas id="grande" width="64" height="64" style="width:256px;height:256px"></canvas><figcaption>4× (para ver os detalhes)</figcaption></figure>
      <figure><canvas id="real" width="64" height="64" style="width:64px;height:64px"></canvas><figcaption>tamanho real (1×)</figcaption></figure>
    </div></div>
    <div class="direcoes">
      <button data-dir="0">↑ Cima</button><button data-dir="1">← Esquerda</button><button data-dir="2" class="ativo">↓ Baixo</button><button data-dir="3">→ Direita</button>
      <button id="anima" class="ativo">▶ Andando</button>
    </div>
  </section>
  <aside class="painel" id="painel"></aside>
  <footer>Sprites: Universal LPC Spritesheet Character Generator — artistas em CREDITOS-LPC.csv (CC-BY-SA 3.0 / GPL 3.0 / OGA-BY 3.0). Cores das paletas do próprio LPC.</footer>
</main>
<script>
const CAMADAS = {
  corpo: { masc: 'corpo/masc', fem: 'corpo/fem' },
  cabeca: { masc: 'cabeca/masc', fem: 'cabeca/fem' },
  camiseta: { masc: 'camiseta/masc', fem: 'camiseta/fem' },
  calca: { masc: 'calca/masc', fem: 'calca/fem' },
  tenis: { masc: 'tenis/masc', fem: 'tenis/fem' },
};
const CABELOS = { bangs: 'Franja', bob: 'Chanel', ponytail: 'Rabo de cavalo', spiked: 'Espetado', messy1: 'Bagunçado', pixie: 'Pixie', long: 'Longo', curly_short: 'Cacheado' };
const PELES = ['light', 'amber', 'olive', 'taupe', 'bronze', 'brown', 'black'];
const CORES_CABELO = ['black', 'dark_brown', 'chestnut', 'light_brown', 'blonde', 'ginger', 'red', 'platinum', 'white', 'pink', 'purple', 'blue', 'green'];
const CORES_ROUPA = ['white', 'black', 'gray', 'red', 'maroon', 'orange', 'yellow', 'green', 'forest', 'teal', 'sky', 'blue', 'navy', 'purple', 'pink', 'brown', 'tan'];

const estado = { corpo: 'masc', pele: 'light', cabelo: 'spiked', corCabelo: 'dark_brown', camiseta: 'red', calca: 'navy', tenis: 'black', dir: 2, andando: true };
const cache = new Map();
let paletas = {};

const carregar = (src) => {
  if (!cache.has(src)) cache.set(src, new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = src; }));
  return cache.get(src);
};

// troca as cores da camada: as cores da imagem (do escuro ao claro) viram as da paleta escolhida, na mesma ordem
const recoloridas = new Map();
function recolorir(img, paleta, chave) {
  if (recoloridas.has(chave)) return recoloridas.get(chave);
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  if (paleta) {
    const dados = ctx.getImageData(0, 0, c.width, c.height);
    const d = dados.data;
    const cores = new Map();
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 0) cores.set((d[i] << 16) | (d[i + 1] << 8) | d[i + 2], 0);
    const lum = (k) => 0.3 * (k >> 16) + 0.59 * ((k >> 8) & 255) + 0.11 * (k & 255);
    const ordem = [...cores.keys()].sort((a, b) => lum(a) - lum(b));
    const alvo = paleta.map((h) => parseInt(h.slice(1), 16));
    ordem.forEach((k, i) => cores.set(k, alvo[Math.round((i * (alvo.length - 1)) / Math.max(1, ordem.length - 1))]));
    for (let i = 0; i < d.length; i += 4) {
      if (!d[i + 3]) continue;
      const n = cores.get((d[i] << 16) | (d[i + 1] << 8) | d[i + 2]);
      d[i] = n >> 16; d[i + 1] = (n >> 8) & 255; d[i + 2] = n & 255;
    }
    ctx.putImageData(dados, 0, 0);
  }
  recoloridas.set(chave, c);
  return c;
}

async function camadas(anim) {
  const s = estado;
  const lista = [];
  if (s.cabelo === 'ponytail') lista.push([`cabelo/ponytail/fundo-${anim}.png`, paletas.hair[s.corCabelo]]);
  lista.push([`${CAMADAS.corpo[s.corpo]}/${anim}.png`, paletas.body[s.pele]]);
  lista.push([`${CAMADAS.cabeca[s.corpo]}/${anim}.png`, paletas.body[s.pele]]);
  lista.push([`olhos/${anim}.png`, null]);
  lista.push([`${CAMADAS.calca[s.corpo]}/${anim}.png`, paletas.cloth[s.calca]]);
  lista.push([`${CAMADAS.tenis[s.corpo]}/${anim}.png`, paletas.cloth[s.tenis]]);
  lista.push([`${CAMADAS.camiseta[s.corpo]}/${anim}.png`, paletas.cloth[s.camiseta]]);
  lista.push([`cabelo/${s.cabelo}/${anim}.png`, paletas.hair[s.corCabelo]]);
  const imgs = await Promise.all(lista.map(([src]) => carregar(src).catch(() => null)));
  return imgs.map((img, i) => img && recolorir(img, lista[i][1], lista[i][0] + JSON.stringify(lista[i][1])));
}

const grande = document.getElementById('grande').getContext('2d');
const real = document.getElementById('real').getContext('2d');
let quadro = 0;
async function desenhar() {
  const anim = estado.andando ? 'walk' : 'idle';
  const imgs = await camadas(anim);
  // andar: 9 quadros por direção (o 0 é parado); parado: 2 quadros
  const total = anim === 'walk' ? 8 : 2;
  const col = anim === 'walk' ? 1 + (quadro % total) : quadro % total;
  for (const ctx of [grande, real]) {
    ctx.clearRect(0, 0, 64, 64);
    for (const img of imgs) if (img) ctx.drawImage(img, col * 64, estado.dir * 64, 64, 64, 0, 0, 64, 64);
  }
}
setInterval(() => { quadro++; desenhar(); }, 110);

function grupo(titulo, itens, atual, aoEscolher, eCor) {
  const g = document.createElement('div');
  g.className = 'grupo';
  g.innerHTML = `<span>${titulo}</span>`;
  const box = document.createElement('div');
  box.className = 'opcoes';
  for (const [valor, rotulo, cor] of itens) {
    const b = document.createElement('button');
    if (eCor) { b.className = 'cor'; b.style.background = cor; b.title = rotulo; } else b.textContent = rotulo;
    if (valor === atual()) b.classList.add('ativo');
    b.onclick = () => { aoEscolher(valor); box.querySelectorAll('button').forEach((x) => x.classList.remove('ativo')); b.classList.add('ativo'); desenhar(); };
    box.append(b);
  }
  g.append(box);
  return g;
}

(async () => {
  const [body, hair, cloth] = await Promise.all(['body', 'hair', 'cloth'].map((n) => fetch(`paletas/${n}_ulpc.json`).then((r) => r.json())));
  paletas = { body, hair, cloth };
  const meio = (p) => p[Math.floor(p.length / 2)];
  const painel = document.getElementById('painel');
  painel.append(
    grupo('Corpo', [['masc', 'Masculino'], ['fem', 'Feminino']], () => estado.corpo, (v) => (estado.corpo = v)),
    grupo('Tom de pele', PELES.map((k) => [k, k, meio(body[k])]), () => estado.pele, (v) => (estado.pele = v), true),
    grupo('Cabelo', Object.entries(CABELOS), () => estado.cabelo, (v) => (estado.cabelo = v)),
    grupo('Cor do cabelo', CORES_CABELO.map((k) => [k, k, meio(hair[k])]), () => estado.corCabelo, (v) => (estado.corCabelo = v), true),
    grupo('Camiseta', CORES_ROUPA.map((k) => [k, k, meio(cloth[k])]), () => estado.camiseta, (v) => (estado.camiseta = v), true),
    grupo('Calça', CORES_ROUPA.map((k) => [k, k, meio(cloth[k])]), () => estado.calca, (v) => (estado.calca = v), true),
    grupo('Tênis', CORES_ROUPA.map((k) => [k, k, meio(cloth[k])]), () => estado.tenis, (v) => (estado.tenis = v), true),
  );
  document.querySelectorAll('[data-dir]').forEach((b) => (b.onclick = () => {
    estado.dir = Number(b.dataset.dir);
    document.querySelectorAll('[data-dir]').forEach((x) => x.classList.toggle('ativo', x === b));
  }));
  const anima = document.getElementById('anima');
  anima.onclick = () => { estado.andando = !estado.andando; anima.classList.toggle('ativo', estado.andando); anima.textContent = estado.andando ? '▶ Andando' : '⏸ Parado'; };
  desenhar();
})();
</script>
</body>
</html>
