<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fragmento Temporal: reloginho de bolso quebrado no meio (as duas metades afastadas) -->
  <defs>
    <linearGradient id="aro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a6"/><stop offset="0.5" stop-color="#e2a93a"/><stop offset="1" stop-color="#8a5a12"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbff"/><stop offset="1" stop-color="#b9dcf2"/>
    </linearGradient>
    <clipPath id="esq"><path d="M0 0H17L14 7l4 5-4 5 3 5-3 10H0z"/></clipPath>
    <clipPath id="dir"><path d="M32 0H17L14 7l4 5-4 5 3 5-3 10h18z"/></clipPath>
