    <circle cx="16" cy="17.5" r="11" fill="url(#aro)" stroke="#5a3a08" stroke-width="1.2"/>
    <circle cx="16" cy="17.5" r="8.3" fill="url(#vidro)" stroke="#5a3a08" stroke-width="0.9"/>
    <path d="M16 10.2v1.8M8.7 17.5h1.8M16 23v1.8" stroke="#3a2a10" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M16 17.5l-4-3.2" stroke="#1d2a44" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g clip-path="url(#dir)" transform="translate(1.6 -0.6) rotate(5 16 17)">
