    <circle cx="16" cy="17.5" r="11" fill="url(#aro)" stroke="#5a3a08" stroke-width="1.2"/>
    <circle cx="16" cy="17.5" r="8.3" fill="url(#vidro)" stroke="#5a3a08" stroke-width="0.9"/>
    <path d="M21.5 17.5h1.8M16 23v1.8M16 10.2v1.8" stroke="#3a2a10" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M16 17.5l5.2 2.2" stroke="#1d2a44" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="16" cy="17.5" r="1.1" fill="#1d2a44"/>
  </g>
  <!-- borda da rachadura -->
  <path d="M17 1l-3 6 4 5-4 5 3 5-3 9" fill="none" stroke="#eafcff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
