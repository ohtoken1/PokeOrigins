  <path d="M0 720 L240 470 L420 620 L660 380 L900 600 L1120 430 L1360 640 L1600 420 L1800 580 L1920 500 L1920 1080 L0 1080 Z" fill="#9fb8cb"/>
  <path d="M240 470 L300 532 L270 540 L230 520 L200 512 Z M660 380 L730 452 L690 462 L650 440 L610 438 Z M1120 430 L1180 492 L1140 500 L1100 480 L1070 482 Z M1600 420 L1660 482 L1620 492 L1580 470 L1550 474 Z" fill="#e9f1f8"/>
  <path d="M0 800 L200 660 L380 760 L600 620 L820 760 L1040 650 L1260 780 L1480 640 L1700 760 L1920 680 L1920 1080 L0 1080 Z" fill="#c9dbe8"/>
  <path d="M0 920 C300 880 700 900 1060 920 C1400 940 1700 900 1920 890 L1920 1080 L0 1080 Z" fill="#8fa9bd"/>
  <!-- pinheiros nevados -->
  <g fill="#5d7a90">
    <path d="M220 940 l40 -110 l40 110 z"/><path d="M300 960 l30 -80 l30 80 z"/>
    <path d="M1560 930 l42 -120 l42 120 z"/><path d="M1650 955 l30 -84 l30 84 z"/><path d="M1740 940 l36 -100 l36 100 z"/>
