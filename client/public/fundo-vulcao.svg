    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132538"/>
      <stop offset="0.6" stop-color="#1d3346"/>
      <stop offset="0.85" stop-color="#2f4b60"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#ceu)"/>
  <g fill="#e9f1f8">
    <circle cx="140" cy="90" r="1.6" opacity="0.7"/><circle cx="420" cy="200" r="1.2" opacity="0.5"/><circle cx="640" cy="70" r="1.8" opacity="0.8"/>
    <circle cx="900" cy="170" r="1.1" opacity="0.5"/><circle cx="1150" cy="60" r="1.6" opacity="0.7"/><circle cx="1380" cy="220" r="1" opacity="0.4"/>
    <circle cx="1600" cy="90" r="1.5" opacity="0.6"/><circle cx="1820" cy="180" r="1.2" opacity="0.5"/><circle cx="300" cy="330" r="1" opacity="0.4"/>
    <circle cx="1000" cy="320" r="1.1" opacity="0.4"/><circle cx="1720" cy="320" r="1" opacity="0.35"/>
  </g>
  <!-- aurora suave -->
  <path d="M0 260 C400 200 800 320 1200 240 C1500 180 1750 260 1920 220 L1920 300 C1700 340 1500 260 1200 320 C800 400 400 280 0 340 Z" fill="#7fd6c8" opacity="0.08"/>
