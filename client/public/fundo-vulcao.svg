    <circle cx="500" cy="500" r="2"/><circle cx="820" cy="300" r="1.6"/><circle cx="1260" cy="520" r="2"/><circle cx="1500" cy="300" r="1.6"/>
    <circle cx="160" cy="560" r="1.8"/><circle cx="1800" cy="420" r="1.8"/><circle cx="1000" cy="800" r="2"/><circle cx="400" cy="860" r="1.6"/>
