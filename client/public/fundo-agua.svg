<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <!-- Mar Profundo: praia ao pôr do sol em tons quentes e suaves (contrasta com o azul do fundo do mar) -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2230"/>
      <stop offset="0.45" stop-color="#5a3a36"/>
      <stop offset="0.62" stop-color="#8a5640"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2a65a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f2a65a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e3e36"/>
      <stop offset="1" stop-color="#2e211c"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#ceu)"/>
  <circle cx="560" cy="560" r="300" fill="url(#sol)"/>
  <circle cx="560" cy="580" r="90" fill="#f2a65a" opacity="0.85"/>
  <g fill="#f6c9a0" opacity="0.14"><ellipse cx="1200" cy="300" rx="320" ry="18"/><ellipse cx="1500" cy="360" rx="220" ry="14"/><ellipse cx="300" cy="380" rx="220" ry="12"/></g>
  <!-- bando de Wingull -->
  <g fill="none" stroke="#2e2230" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <path d="M1250 420 q12 -12 24 0 q12 -12 24 0"/><path d="M1320 390 q9 -9 18 0 q9 -9 18 0"/><path d="M1380 430 q8 -8 16 0 q8 -8 16 0"/>
  </g>
  <!-- mar -->
  <rect y="640" width="1920" height="440" fill="url(#mar)"/>
  <g fill="#f2c28a" opacity="0.4">
    <rect x="470" y="660" width="180" height="4" rx="2"/><rect x="500" y="684" width="120" height="4" rx="2"/>
    <rect x="520" y="708" width="80" height="3" rx="1.5"/><rect x="540" y="730" width="40" height="3" rx="1.5"/>
  </g>
  <g fill="#c98f6a" opacity="0.18">
    <rect x="900" y="700" width="260" height="3" rx="1.5"/><rect x="1300" y="740" width="200" height="3" rx="1.5"/><rect x="200" y="760" width="180" height="3" rx="1.5"/>
  </g>
  <!-- areia -->
  <path d="M0 880 C300 840 700 860 1100 880 C1450 900 1700 860 1920 850 L1920 1080 L0 1080 Z" fill="#3b2a24"/>
  <path d="M0 960 C400 930 900 950 1300 960 C1600 970 1780 950 1920 945 L1920 1080 L0 1080 Z" fill="#2e211c"/>
  <!-- concha e estrela-do-mar -->
  <g fill="#7a5544">
    <path d="M1500 990 a28 22 0 0 1 56 0 z"/>
    <path d="M300 1010 l8 -20 l8 20 l20 2 l-16 12 l6 20 l-18 -12 l-18 12 l6 -20 l-16 -12 z"/>
  </g>
</svg>
